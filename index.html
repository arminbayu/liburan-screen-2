<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Liburan Akhir Tahun</title>
    <meta name="theme-color" content="#ff7ab6" />

    <style>
        :root {
            --shadow: 0 22px 70px rgba(0, 0, 0, .25);
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        /* ====== STAGE FULLSCREEN ====== */
        .stage {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #000;
        }

        /* ====== BACKGROUND FULLSCREEN (cover + blur) ====== */
        .bg {
            position: absolute;
            inset: -40px;
            /* biar blur tidak kelihatan tepi */
            background-image: var(--poster-url);
            background-size: cover;
            background-position: center;
            filter: blur(22px) saturate(1.15) brightness(.9);
            transform: scale(1.08);
            animation: bgDrift 10s ease-in-out infinite alternate;
        }

        @keyframes bgDrift {
            from {
                transform: scale(1.08) translateX(-1.2%) translateY(-1%);
            }

            to {
                transform: scale(1.12) translateX(1.2%) translateY(1%);
            }
        }

        /* vignette biar fokus ke tengah */
        .vignette {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(closest-side at 50% 50%, rgba(0, 0, 0, 0) 0 60%, rgba(0, 0, 0, .35) 100%);
            pointer-events: none;
        }

        /* ====== POSTER LAYER (contain, tidak kepotong) ====== */
        .posterWrap {
            position: relative;
            width: min(92vw, 1100px);
            height: min(92vh, 700px);
            display: grid;
            place-items: center;
            z-index: 5;
        }

        /* 16:9 safe area untuk TV */
        @media (min-aspect-ratio: 16/9) {
            .posterWrap {
                width: min(88vw, 1200px);
                height: min(80vh, 720px);
            }
        }

        .poster {
            width: 100%;
            height: 100%;
            background-image: var(--poster-url);
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            /* PENTING: tidak kepotong */
            filter: drop-shadow(0 22px 50px rgba(0, 0, 0, .28));
            transform-origin: center;
            animation: posterFloat 3.6s ease-in-out infinite;
        }

        @keyframes posterFloat {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-10px) scale(1.01);
            }
        }

        /* frame lucu biar kaya “panggung” */
        .frameGlow {
            position: absolute;
            inset: -10px;
            border-radius: 26px;
            background:
                radial-gradient(closest-side at 20% 20%, rgba(255, 74, 160, .22), transparent 60%),
                radial-gradient(closest-side at 80% 30%, rgba(43, 183, 255, .22), transparent 62%),
                radial-gradient(closest-side at 55% 85%, rgba(46, 230, 198, .18), transparent 62%);
            filter: blur(18px);
            z-index: -1;
            opacity: .9;
            animation: glowMove 8s ease-in-out infinite alternate;
        }

        @keyframes glowMove {
            from {
                transform: translate(-1%, -1%) scale(1);
            }

            to {
                transform: translate(1%, 1%) scale(1.05);
            }
        }

        /* ====== OVERLAY ANIMATIONS ====== */
        .layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        /* bubbles canvas */
        canvas#bubbles {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: .75;
        }

        /* falling flowers */
        .fall-flower {
            position: absolute;
            top: -12vh;
            left: var(--x);
            width: var(--s);
            height: var(--s);
            opacity: var(--o);
            transform: translate(-50%, -50%) rotate(var(--r));
            animation:
                fallDown var(--dur) linear infinite,
                swayX calc(var(--dur)*.35) ease-in-out infinite alternate,
                spin calc(var(--dur)*.55) linear infinite;
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .06));
        }

        @keyframes fallDown {
            from {
                transform: translate(-50%, -15vh) rotate(var(--r));
            }

            to {
                transform: translate(-50%, 120vh) rotate(calc(var(--r) + 140deg));
            }
        }

        @keyframes swayX {
            from {
                margin-left: -22px
            }

            to {
                margin-left: 22px
            }
        }

        @keyframes spin {
            from {
                rotate: 0deg
            }

            to {
                rotate: 360deg
            }
        }

        .fall-flower::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .95) 0 18%, rgba(255, 255, 255, 0) 19%),
                radial-gradient(circle at 50% 15%, var(--c) 0 28%, rgba(0, 0, 0, 0) 29%),
                radial-gradient(circle at 85% 50%, var(--c) 0 28%, rgba(0, 0, 0, 0) 29%),
                radial-gradient(circle at 50% 85%, var(--c) 0 28%, rgba(0, 0, 0, 0) 29%),
                radial-gradient(circle at 15% 50%, var(--c) 0 28%, rgba(0, 0, 0, 0) 29%);
            border-radius: 50%;
        }

        /* balloons (top area biar tidak nutup teks) */
        .balloon {
            position: absolute;
            left: -25vw;
            top: var(--y);
            width: var(--w);
            height: calc(var(--w)*1.25);
            opacity: var(--o);
            animation:
                flyAcross var(--dur) linear infinite,
                bobY calc(var(--dur)*.18) ease-in-out infinite alternate;
            filter: drop-shadow(0 16px 26px rgba(0, 0, 0, .10));
        }

        @keyframes flyAcross {
            from {
                transform: translateX(-25vw)
            }

            to {
                transform: translateX(140vw)
            }
        }

        @keyframes bobY {
            from {
                margin-top: -10px
            }

            to {
                margin-top: 10px
            }
        }

        .balloon .body {
            width: 100%;
            height: 100%;
            border-radius: 999px;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 45%),
                linear-gradient(145deg, rgba(255, 255, 255, .25), rgba(255, 255, 255, 0)),
                var(--grad);
            border: 1px solid rgba(255, 255, 255, .55);
            position: relative;
        }

        .balloon .knot {
            position: absolute;
            left: 50%;
            bottom: -10px;
            width: 16px;
            height: 14px;
            transform: translateX(-50%) rotate(8deg);
            background: var(--knot);
            clip-path: polygon(50% 0, 0 100%, 100% 100%);
            border-radius: 2px;
        }

        .balloon .string {
            position: absolute;
            left: 50%;
            top: calc(100% + 2px);
            width: 2px;
            height: calc(var(--w) * 1.1);
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .18);
            border-radius: 99px;
        }

        /* ====== Controls kecil (optional) ====== */
        .controls {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 20;
            display: flex;
            gap: 10px;
            align-items: center;
            opacity: .9;
        }

        .btn {
            appearance: none;
            border: none;
            cursor: pointer;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .78);
            box-shadow: var(--shadow);
            font-weight: 800;
        }

        .btn:hover {
            filter: brightness(1.03);
            transform: translateY(-1px);
        }

        .hint {
            color: rgba(255, 255, 255, .85);
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .4);
        }

        body.fullscreen .controls {
            opacity: 0;
            pointer-events: none;
        }

        body.fullscreen:hover .controls {
            opacity: 1;
            pointer-events: auto;
        }

        @media (prefers-reduced-motion: reduce) {

            .bg,
            .poster,
            .frameGlow,
            .balloon,
            .fall-flower {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="stage" id="stage">
        <!-- ubah poster-url di JS -->
        <div class="bg"></div>
        <div class="vignette"></div>

        <div class="posterWrap">
            <div class="frameGlow"></div>
            <div class="poster" aria-label="Poster Liburan"></div>
        </div>

        <!-- overlay effects -->
        <div class="layer" id="fxLayer">
            <canvas id="bubbles"></canvas>
            <div id="flowersFall"></div>
            <div id="balloons"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="btnFs">⛶ Fullscreen</button>
        <button class="btn" id="btnRefresh">✨ Refresh FX</button>
        <div class="hint">Tip: tekan <b>F</b> untuk fullscreen</div>
    </div>

    <script>
        // ===============================
        // 1) SET POSTER URL DI SINI
        // ===============================
        // Taruh file poster di folder yg sama: poster.jpg / poster.png
        const POSTER_URL = "liburan.png"; // <-- GANTI INI!

        // apply ke CSS variable
        document.documentElement.style.setProperty('--poster-url', `url("${POSTER_URL}")`);

        // ===============================
        // 2) Falling flowers + balloons
        // ===============================
        const flowerColors = [
            'rgba(255, 74, 160, .70)',
            'rgba(124, 77, 255, .60)',
            'rgba(43, 183, 255, .65)',
            'rgba(46, 230, 198, .55)',
            'rgba(255, 211, 61, .65)',
            'rgba(255, 138, 61, .58)'
        ];

        const flowersFall = document.getElementById('flowersFall');
        const balloonsEl = document.getElementById('balloons');

        function spawnFallingFlowers() {
            flowersFall.innerHTML = '';
            const count = Math.max(24, Math.floor((innerWidth * innerHeight) / 52000));
            for (let i = 0; i < count; i++) {
                const f = document.createElement('div');
                f.className = 'fall-flower';
                const s = (Math.random() * 26 + 18);
                const x = (Math.random() * 100) + '%';
                const r = (Math.random() * 360) + 'deg';
                const dur = (Math.random() * 10 + 10) + 's';
                const o = (Math.random() * 0.45 + 0.25);
                const c = flowerColors[Math.floor(Math.random() * flowerColors.length)];

                f.style.setProperty('--s', s + 'px');
                f.style.setProperty('--x', x);
                f.style.setProperty('--r', r);
                f.style.setProperty('--dur', dur);
                f.style.setProperty('--o', o);
                f.style.setProperty('--c', c);
                f.style.animationDelay = (-Math.random() * 12) + 's';
                flowersFall.appendChild(f);
            }
        }

        const balloonGradients = [
            { grad: 'linear-gradient(180deg, #ff9bd0, #ff4aa0)', knot: '#ff4aa0' },
            { grad: 'linear-gradient(180deg, #98e8ff, #2bb7ff)', knot: '#2bb7ff' },
            { grad: 'linear-gradient(180deg, #fff1a6, #ffd33d)', knot: '#ffd33d' },
            { grad: 'linear-gradient(180deg, #b6fff3, #2ee6c6)', knot: '#2ee6c6' },
            { grad: 'linear-gradient(180deg, #c2b4ff, #7c4dff)', knot: '#7c4dff' },
            { grad: 'linear-gradient(180deg, #ffd1b0, #ff8a3d)', knot: '#ff8a3d' },
        ];

        function spawnBalloons() {
            balloonsEl.innerHTML = '';
            const n = Math.max(7, Math.floor(innerWidth / 220));

            for (let i = 0; i < n; i++) {
                const b = document.createElement('div');
                b.className = 'balloon';

                const pick = balloonGradients[Math.floor(Math.random() * balloonGradients.length)];
                const w = Math.random() * 38 + 46;

                // Biar tidak nutup teks: balon lewat di area atas (2%..35%)
                const y = (Math.random() * 33 + 2) + '%';

                const dur = (Math.random() * 18 + 18) + 's';
                const o = (Math.random() * 0.25 + 0.55);

                b.style.setProperty('--w', w + 'px');
                b.style.setProperty('--y', y);
                b.style.setProperty('--dur', dur);
                b.style.setProperty('--o', o);
                b.style.setProperty('--grad', pick.grad);
                b.style.setProperty('--knot', pick.knot);
                b.style.animationDelay = (-Math.random() * 20) + 's';

                b.innerHTML = `
        <div class="body" style="--grad:${pick.grad}">
          <div class="knot" style="background:${pick.knot}"></div>
          <div class="string"></div>
        </div>
      `;
                balloonsEl.appendChild(b);
            }
        }

        function refreshFX() {
            spawnFallingFlowers();
            spawnBalloons();
            initBubbles(true);
        }

        // ===============================
        // 3) Bubbles canvas (transparent)
        // ===============================
        const canvas = document.getElementById('bubbles');
        const ctx = canvas.getContext('2d');
        let dpr = 1;
        let blobs = [];
        const MAX = 80;

        function resizeCanvas() {
            dpr = Math.min(devicePixelRatio || 1, 2);
            canvas.width = Math.floor(innerWidth * dpr);
            canvas.height = Math.floor(innerHeight * dpr);
            canvas.style.width = innerWidth + 'px';
            canvas.style.height = innerHeight + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        function rand(min, max) { return Math.random() * (max - min) + min; }

        function initBubbles(reset = false) {
            if (reset) blobs = [];
            resizeCanvas();
            if (blobs.length === 0) {
                for (let i = 0; i < MAX; i++) {
                    blobs.push({
                        x: rand(0, innerWidth),
                        y: rand(0, innerHeight),
                        r: rand(6, 20),
                        vx: rand(-0.22, 0.22),
                        vy: rand(-0.30, 0.18),
                        a: rand(0.10, 0.55),
                    });
                }
            }
        }

        function drawBubbles() {
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            for (const b of blobs) {
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < -40) b.x = innerWidth + 40;
                if (b.x > innerWidth + 40) b.x = -40;
                if (b.y < -40) b.y = innerHeight + 40;
                if (b.y > innerHeight + 40) b.y = -40;

                // bubble main
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${b.a})`;
                ctx.fill();

                // rim
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,255,255,${Math.min(b.a + 0.12, 0.75)})`;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // highlight
                ctx.beginPath();
                ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${Math.min(b.a + 0.18, 0.8)})`;
                ctx.fill();
            }
            requestAnimationFrame(drawBubbles);
        }

        // ===============================
        // 4) Fullscreen
        // ===============================
        const btnFs = document.getElementById('btnFs');
        async function enterFullscreen() {
            try {
                if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
            } catch (e) { }
            document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
        }
        function exitFullscreen() {
            if (document.fullscreenElement) document.exitFullscreen();
        }
        btnFs.addEventListener('click', () => {
            if (document.fullscreenElement) exitFullscreen();
            else enterFullscreen();
        });
        addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                if (document.fullscreenElement) exitFullscreen();
                else enterFullscreen();
            }
        });
        document.addEventListener('fullscreenchange', () => {
            document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
            btnFs.textContent = document.fullscreenElement ? '⤢ Exit' : '⛶ Fullscreen';
        });

        // ===============================
        // init
        // ===============================
        refreshFX();
        initBubbles();
        drawBubbles();

        addEventListener('resize', () => {
            refreshFX();
            initBubbles();
        });

        document.getElementById('btnRefresh').addEventListener('click', refreshFX);
    </script>
</body>

</html>
